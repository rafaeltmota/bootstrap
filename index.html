<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Aula de Bootstrap</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Maravi</a>
            <button 
                class="navbar-toggler" 
                type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" 
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div 
                class="collapse navbar-collapse" 
                id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Edições
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">1.0</a></li>
                            <li><a class="dropdown-item" href="#">2.0</a></li>
                            <li><a class="dropdown-item" href="#">3.0</a></li>
                            <li><a class="dropdown-item" href="#">4.0</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Fale com a Coordenação!</a></li>
                        </ul>
                    
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Digite sua Pesquisa" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Procurar</button>

                    <!-- Botão de alternar tema -->
                    <button id="themeToggle" type="button" class="btn btn-outline-light ms-2" aria-label="Alternar tema">
                        <!-- ícone será definido pelo script -->
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        (function () {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');

            const moonSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 0a6 6 0 1 0 0 12c4.418 0 6-3.582 6-6S10.418 0 6 0z"/></svg>';
            const sunSVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M8 0v2M8 14v2M0 8h2M14 8h2M2.93 2.93l1.414 1.414M11.657 11.657l1.414 1.414M2.93 13.07l1.414-1.414M11.657 4.343l1.414-1.414"/></svg>';

            function setTheme(theme) {
                html.setAttribute('data-bs-theme', theme);
                localStorage.setItem('theme', theme);
                if (theme === 'dark') {
                    btn.classList.remove('btn-outline-dark');
                    btn.classList.add('btn-outline-light');
                    btn.innerHTML = moonSVG + '<span class="visually-hidden">Tema escuro</span>';
                } else {
                    btn.classList.remove('btn-outline-light');
                    btn.classList.add('btn-outline-dark');
                    btn.innerHTML = sunSVG + '<span class="visually-hidden">Tema claro</span>';
                }
            }

            const stored = localStorage.getItem('theme');
            const initial = stored || html.getAttribute('data-bs-theme') || 'light';
            setTheme(initial);

            btn.addEventListener('click', function () {
                const current = html.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
                setTheme(current === 'dark' ? 'light' : 'dark');
            });
        })();
    </script>
</body>

</html>
