<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Aula de Bootstrap</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Básica Informática</a>
            <button 
                class="navbar-toggler" 
                type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" 
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div 
                class="collapse navbar-collapse" 
                id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Edições
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">1.0</a></li>
                            <li><a class="dropdown-item" href="#">2.0</a></li>
                            <li><a class="dropdown-item" href="#">3.0</a></li>
                            <li><a class="dropdown-item" href="#">4.0</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Fale com a Coordenação!</a></li>
                        </ul>
                    
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Digite sua Pesquisa" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Procurar</button>

                    <!-- Botão de alternar tema -->
                    <button id="themeToggle" type="button" class="btn btn-outline-light ms-2" aria-label="Alternar tema">
                        <!-- ícone será definido pelo script -->
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section aria-labelledby="operationalPreferencesTitle">
            <h1 id="operationalPreferencesTitle" class="h4">Preferências operacionais do cliente</h1>
            <p class="text-body-secondary">
                Selecione as preferências e salve-as neste navegador.
            </p>

            <form id="operationalPreferencesForm" class="row g-3">
                <div class="col-12 col-md-4">
                    <label for="course" class="form-label">Curso</label>
                    <select id="course" class="form-select" required>
                        <option value="">Selecione um curso</option>
                        <option value="Informática Básica">Informática Básica</option>
                        <option value="Informática para o Mercado de Trabalho">Informática para o Mercado de Trabalho</option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label for="shift" class="form-label">Turno</label>
                    <select id="shift" class="form-select" required>
                        <option value="">Selecione um turno</option>
                        <option value="Manhã">Manhã</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Noite">Noite</option>
                    </select>
                </div>

                <div class="col-12 col-md-4">
                    <label for="schedule" class="form-label">Horário</label>
                    <select id="schedule" class="form-select" required>
                        <option value="">Selecione um horário</option>
                        <option value="08:00 às 10:00">08:00 às 10:00</option>
                        <option value="10:00 às 12:00">10:00 às 12:00</option>
                        <option value="13:00 às 15:00">13:00 às 15:00</option>
                        <option value="15:00 às 17:00">15:00 às 17:00</option>
                        <option value="17:00 às 19:00">17:00 às 19:00</option>
                        <option value="19:00 às 21:00">19:00 às 21:00</option>
                    </select>
                </div>

                <fieldset class="col-12 col-md-4">
                    <legend class="col-form-label pt-0">Dias</legend>
                    <div class="form-check">
                        <input id="mondayTuesday" class="form-check-input" type="radio" name="days" value="Segunda e terça" required>
                        <label class="form-check-label" for="mondayTuesday">Segunda e terça</label>
                    </div>
                    <div class="form-check">
                        <input id="wednesdayThursday" class="form-check-input" type="radio" name="days" value="Quarta e quinta">
                        <label class="form-check-label" for="wednesdayThursday">Quarta e quinta</label>
                    </div>
                </fieldset>

                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar preferências</button>
                    <button id="loadOperationalPreferences" type="button" class="btn btn-outline-secondary">
                        Carregar preferências
                    </button>
                </div>
            </form>

            <p id="operationalPreferencesStatus" class="mt-3" aria-live="polite"></p>
            <pre id="operationalPreferencesResult" class="p-3 bg-body-tertiary rounded" aria-live="polite"></pre>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        (function () {
            const storageKey = 'operationalPreferences';
            const form = document.getElementById('operationalPreferencesForm');
            const loadButton = document.getElementById('loadOperationalPreferences');
            const status = document.getElementById('operationalPreferencesStatus');
            const result = document.getElementById('operationalPreferencesResult');

            function displayPreferences(preferences) {
                result.textContent = JSON.stringify(preferences, null, 2);
            }

            window.salvarPreferenciasOperacionais = function () {
                if (!form.reportValidity()) {
                    return null;
                }

                const preferences = {
                    curso: document.getElementById('course').value,
                    turno: document.getElementById('shift').value,
                    horario: document.getElementById('schedule').value,
                    dias: form.elements.days.value
                };

                localStorage.setItem(storageKey, JSON.stringify(preferences));
                status.textContent = 'Preferências salvas neste navegador.';
                displayPreferences(preferences);
                return preferences;
            };

            window.carregarPreferenciasOperacionais = function () {
                const storedPreferences = localStorage.getItem(storageKey);
                const preferences = storedPreferences ? JSON.parse(storedPreferences) : null;

                if (!preferences) {
                    status.textContent = 'Nenhuma preferência salva foi encontrada.';
                    result.textContent = '';
                    return null;
                }

                document.getElementById('course').value = preferences.curso;
                document.getElementById('shift').value = preferences.turno;
                document.getElementById('schedule').value = preferences.horario;
                const daysInput = form.elements.days;
                Array.from(daysInput).find((input) => input.value === preferences.dias).checked = true;
                status.textContent = 'Preferências carregadas.';
                displayPreferences(preferences);
                return preferences;
            };

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                window.salvarPreferenciasOperacionais();
            });

            loadButton.addEventListener('click', function () {
                window.carregarPreferenciasOperacionais();
            });
        })();
    </script>

    <script>
        (function () {
            const html = document.documentElement;
            const btn = document.getElementById('themeToggle');

            const moonSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 0a6 6 0 1 0 0 12c4.418 0 6-3.582 6-6S10.418 0 6 0z"/></svg>';
            const sunSVG  = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/><path d="M8 0v2M8 14v2M0 8h2M14 8h2M2.93 2.93l1.414 1.414M11.657 11.657l1.414 1.414M2.93 13.07l1.414-1.414M11.657 4.343l1.414-1.414"/></svg>';

            function setTheme(theme) {
                html.setAttribute('data-bs-theme', theme);
                localStorage.setItem('theme', theme);
                if (theme === 'dark') {
                    btn.classList.remove('btn-outline-dark');
                    btn.classList.add('btn-outline-light');
                    btn.innerHTML = moonSVG + '<span class="visually-hidden">Tema escuro</span>';
                } else {
                    btn.classList.remove('btn-outline-light');
                    btn.classList.add('btn-outline-dark');
                    btn.innerHTML = sunSVG + '<span class="visually-hidden">Tema claro</span>';
                }
            }

            const stored = localStorage.getItem('theme');
            const initial = stored || html.getAttribute('data-bs-theme') || 'light';
            setTheme(initial);

            btn.addEventListener('click', function () {
                const current = html.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
                setTheme(current === 'dark' ? 'light' : 'dark');
            });
        })();
    </script>
</body>

</html>
